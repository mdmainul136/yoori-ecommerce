version: '3.8'

services:
  # Traefik Load Balancer & SSL Provider
  traefik:
    image: traefik:v3.3
    user: root
    restart: always
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.myresolver.acme.email=admin@gorolyshop.com"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - yoori-network

  # PHP Application (Laravel)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - APP_ENV=production
      - APP_URL=https://gorolyshop.com
      - DB_HOST=db
      - DB_DATABASE=${DB_DATABASE:-yoori}
      - DB_USERNAME=${DB_USERNAME:-yoori_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
    networks:
      - yoori-network
    depends_on:
      - db
      - redis

  # Queue Worker (For Emails and Background Tasks)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command: php artisan queue:work --tries=3 --timeout=90
    environment:
      - APP_ENV=production
      - DB_HOST=db
      - DB_DATABASE=${DB_DATABASE:-yoori}
      - DB_USERNAME=${DB_USERNAME:-yoori_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
    networks:
      - yoori-network
    depends_on:
      - db
      - redis

  # Web Server (Nginx)
  web:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    restart: always
    labels:
      - "traefik.enable=true"
      # HTTPS router
      - "traefik.http.routers.yoori.rule=Host(`gorolyshop.com`) || Host(`www.gorolyshop.com`)"
      - "traefik.http.routers.yoori.entrypoints=websecure"
      - "traefik.http.routers.yoori.tls=true"
      - "traefik.http.routers.yoori.tls.certresolver=myresolver"
      - "traefik.http.routers.yoori.tls.domains[0].main=gorolyshop.com"
      - "traefik.http.routers.yoori.tls.domains[0].sans=www.gorolyshop.com"
      - "traefik.http.services.yoori.loadbalancer.server.port=80"
      # HTTP router → redirect to HTTPS (handled at entrypoint level above, these are backup labels)
      - "traefik.http.routers.yoori-http.rule=Host(`gorolyshop.com`) || Host(`www.gorolyshop.com`)"
      - "traefik.http.routers.yoori-http.entrypoints=web"
      - "traefik.http.routers.yoori-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"
    networks:
      - yoori-network
    depends_on:
      - app

  # Database (MariaDB)
  db:
    image: mariadb:10.6
    restart: always
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-yoori}
      - MYSQL_USER=${DB_USERNAME:-yoori_user}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - yoori-network

  # Redis
  redis:
    image: redis:alpine
    restart: always
    networks:
      - yoori-network

networks:
  yoori-network:
    driver: bridge

volumes:
  db-data:
