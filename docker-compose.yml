version: '3.8'

services:
  # PHP Application (Laravel)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - APP_ENV=production
      - APP_URL=https://gorolyshop.com
      - DB_HOST=db
      - DB_DATABASE=${DB_DATABASE:-yoori}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
    networks:
      - yoori-network

  # Web Server (Nginx)
  web:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    restart: always
    ports:
      - "80:80"
    networks:
      - yoori-network
    depends_on:
      - app

  # Database (MariaDB)
  db:
    image: mariadb:10.6
    restart: always
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-yoori}
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - yoori-network

  # Redis
  redis:
    image: redis:alpine
    restart: always
    networks:
      - yoori-network

networks:
  yoori-network:
    driver: bridge

volumes:
  db-data:
